# isort reads a `pyproject.toml` from its `tool.isort` table. The
# generated copy keeps the same name, so it is read back the same way.
[tool.isort]

# Deliberately unlike the workspace's own `.isort.cfg`, which uses the
# `black` profile and would join the two imports in `single_line.py`
# into one. A check that passes here is a check that read this file.
force_single_line = true
known_first_party = ["python"]
